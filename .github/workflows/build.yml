name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.bat < nul

      - uses: actions/upload-artifact@v4
        with:
          name: VgcStatus
          path: VgcStatus.exe
